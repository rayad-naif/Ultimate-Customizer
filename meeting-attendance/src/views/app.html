<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__APP_NAME__</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --good:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#e5e7eb; --muted:#9ca3af; --line:#2a2f38; --accent:#60a5fa; --good:#4ade80; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:0 0 12px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .conn { border:1px solid var(--line); border-radius:8px; padding:12px; }
  .conn b { display:block; } .conn small { color:var(--muted); display:block; min-height:20px; word-break:break-all; }
  .ok { color:var(--good); } .err { color:var(--bad); }
  label { display:block; margin:0 0 10px; } label span { display:block; color:var(--muted); font-size:12px; margin-bottom:2px; }
  input, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
  input[type=checkbox] { width:auto; margin-right:6px; }
  button { padding:7px 14px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:top; }
  td:first-child { white-space:nowrap; color:var(--muted); width:1%; }
  #msg { position:fixed; right:16px; bottom:16px; background:var(--ink); color:var(--bg); padding:8px 12px; border-radius:6px; display:none; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>__APP_NAME__</h1>
  <p class="sub" id="status">Signing you in…</p>

  <div id="ui" hidden>
    <section class="card">
      <h2>Meeting platforms</h2>
      <div class="grid" id="conns"></div>
      <p class="note">Connect the same Zoom, Microsoft 365 or Google account your calendars use to create meetings. Only meetings that account hosts can be checked.</p>
    </section>

    <form id="f">
      <section class="card">
        <h2>Attendance rules</h2>
        <div class="grid">
          <label><span>Mode</span><select name="mode"><option value="auto">Mark Showed / No-show automatically</option><option value="review">Suggest only (create a review task)</option><option value="off">Off</option></select></label>
          <label><span>Check this many minutes after the meeting ends</span><input name="delayMinutes" type="number" min="0" max="240"></label>
          <label><span>Showed if attended at least (minutes)</span><input name="minMinutes" type="number" min="0" max="600"></label>
          <label><span>…or this % of the meeting, whichever is lower</span><input name="minPercent" type="number" min="0" max="100"></label>
          <label><span>Tag as late after (minutes)</span><input name="lateMinutes" type="number" min="0" max="240"></label>
          <label><span>Joined but below the minimum</span><select name="shortAttendance"><option value="review">Create a review task</option><option value="noshow">Mark No-show</option><option value="showed">Mark Showed</option></select></label>
          <label><span>Meeting not found / nobody joined</span><select name="noMeeting"><option value="review">Create a review task</option><option value="ignore">Leave it</option></select></label>
          <label><span>Match confidence needed to auto-mark (50–100)</span><input name="confidence" type="number" min="50" max="100"></label>
        </div>
        <label><input type="checkbox" name="updateFields">Write attendance to contact custom fields (minutes, %, joined at, totals)</label>
        <div class="grid">
          <label><span>Tag: showed</span><input name="tags.showed"></label>
          <label><span>Tag: no-show</span><input name="tags.noshow"></label>
          <label><span>Tag: late</span><input name="tags.late"></label>
          <label><span>Tag: needs review</span><input name="tags.review"></label>
        </div>
      </section>

      <section class="card">
        <h2>Meeting notes</h2>
        <label><input type="checkbox" name="notes.enabled">Save meeting notes to each attendee's contact</label>
        <div class="grid">
          <label><span>One-to-one appointments</span><select name="notes.oneToOne"><option value="full">AI summary, decisions and action items</option><option value="attendance">Attendance line only</option><option value="off">No note</option></select></label>
          <label><span>Class / group bookings</span><select name="notes.classMode"><option value="attendance">Attendance line only</option><option value="shared">Same session summary for everyone</option><option value="personal">Session summary + each person's own points</option><option value="off">No note</option></select></label>
        </div>
        <label><input type="checkbox" name="notes.attendanceOnlyNote">If no transcript or summary exists, still add an attendance note</label>
        <p class="note" id="aiNote"></p>
      </section>
      <button type="submit">Save settings</button>
    </form>

    <section class="card" style="margin-top:16px">
      <h2>Recent activity</h2>
      <table id="log"></table>
    </section>
  </div>
</main>
<div id="msg"></div>
<script>
(function () {
  var token = null, state = null;
  var $ = function (s) { return document.querySelector(s); };
  function toast(t) { var m = $('#msg'); m.textContent = t; m.style.display = 'block'; setTimeout(function () { m.style.display = 'none'; }, 2500); }
  function api(path, body) {
    return fetch('/app/api' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Request failed'); return j; }); });
  }
  function get(o, k) { return k.split('.').reduce(function (a, p) { return a == null ? a : a[p]; }, o); }
  function set(o, k, v) { var ps = k.split('.'), last = ps.pop(); ps.forEach(function (p) { o = o[p] = o[p] || {}; }); o[last] = v; }

  function render() {
    var c = $('#conns'); c.innerHTML = '';
    Object.keys(state.connections).forEach(function (k) {
      var x = state.connections[k], d = document.createElement('div'); d.className = 'conn';
      var b = document.createElement('b'); b.textContent = x.label; d.appendChild(b);
      var s = document.createElement('small');
      if (!x.configured) s.textContent = 'Not available on this server';
      else if (x.broken) { s.className = 'err'; s.textContent = x.broken; }
      else if (x.connected) { s.className = 'ok'; s.textContent = 'Connected: ' + (x.account.email || x.account.name); }
      else s.textContent = 'Not connected';
      d.appendChild(s);
      if (x.configured) {
        var btn = document.createElement('button'); btn.type = 'button';
        btn.className = x.connected && !x.broken ? 'ghost' : '';
        btn.textContent = x.connected && !x.broken ? 'Disconnect' : (x.broken ? 'Reconnect' : 'Connect');
        btn.onclick = function () { x.connected && !x.broken ? disconnect(k) : connect(k); };
        d.appendChild(btn);
      }
      c.appendChild(d);
    });
    var f = $('#f');
    Array.prototype.forEach.call(f.elements, function (el) {
      if (!el.name) return;
      var v = get(state.settings, el.name);
      if (el.type === 'checkbox') el.checked = !!v; else el.value = v == null ? '' : v;
    });
    $('#aiNote').textContent = state.notesAi ? '' : 'AI summaries are not enabled on this server yet (no Claude API key), so notes will contain attendance only.';
    var t = $('#log'); t.innerHTML = '';
    if (!state.logs.length) { t.innerHTML = '<tr><td>-</td><td>No activity yet.</td></tr>'; }
    state.logs.forEach(function (l) {
      var tr = document.createElement('tr'), a = document.createElement('td'), b = document.createElement('td');
      a.textContent = new Date(l.at).toLocaleString(); b.textContent = l.code.replace(/_/g, ' ') + (l.detail ? ': ' + l.detail : '');
      tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
    });
  }
  function load() { return api('/state').then(function (s) { state = s; render(); }); }
  function connect(p) {
    var w = window.open('about:blank', 'ma-connect', 'width=560,height=720');
    api('/connect/' + p, {}).then(function (r) { if (w) w.location = r.url; else location.href = r.url; }).catch(function (e) { if (w) w.close(); toast(e.message); });
  }
  function disconnect(p) {
    if (!confirm('Disconnect ' + state.connections[p].label + '? Meetings on it will no longer be checked.')) return;
    api('/disconnect/' + p, {}).then(load).then(function () { toast('Disconnected'); });
  }
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'ma-connected') { load().then(function () { toast(d.ok ? 'Connected' : 'Not connected'); }); }
    if (d.message === 'REQUEST_USER_DATA_RESPONSE' && d.payload && !token) {
      fetch('/app/sso', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ payload: d.payload }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); })
        .then(function (j) { token = j.token; $('#status').textContent = 'Signed in' + (j.user ? ' as ' + j.user : '') + '. Changes save to this sub-account.'; $('#ui').hidden = false; return load(); })
        .catch(function (err) { $('#status').textContent = err.message; });
    }
  });
  $('#f').addEventListener('submit', function (e) {
    e.preventDefault();
    var out = JSON.parse(JSON.stringify(state.settings));
    Array.prototype.forEach.call(e.target.elements, function (el) {
      if (!el.name) return;
      set(out, el.name, el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value);
    });
    api('/settings', out).then(function (r) { state.settings = r.settings; render(); toast('Saved'); }).catch(function (err) { toast(err.message); });
  });
  if (window.parent === window) { $('#status').textContent = 'Open this page from the app link in your HighLevel sub-account sidebar.'; return; }
  window.parent.postMessage({ message: 'REQUEST_USER_DATA' }, '*');
  setTimeout(function () { if (!token && $('#status').textContent === 'Signing you in…') $('#status').textContent = 'Could not get your HighLevel session. Reload the page.'; }, 8000);
})();
</script>
</body>
</html>
